<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Playwright</title>
    <link rel="stylesheet" href="test-editor.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .panel {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h3::before {
            content: "▶";
            color: #667eea;
            font-size: 0.8em;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(86, 171, 47, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(240, 147, 251, 0.3);
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .output {
            background: #2c3e50;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .status {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            margin-top: 10px;
        }

        .status.running {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .icon {
            font-size: 16px;
        }

        /* Estilos para el Editor de Tests */
        .test-editor {
            margin-top: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }

        .editor-header {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .test-selector {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
            background: white;
        }

        .test-code {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: #f8f9fa;
            resize: vertical;
            margin-bottom: 15px;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-sm {
            padding: 8px 15px;
            font-size: 12px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
        }

        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Panel de Control Playwright</h1>
            <p>Gestiona tus pruebas automatizadas de manera sencilla</p>
        </div>

        <div class="panel">
            <!-- Sección de Tests Dinámicos -->
            <div class="section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">📋 Listado de Tests</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-info btn-sm" onclick="reloadTestsList()">
                            <span class="icon">🔄</span>
                            Recargar listado de tests
                        </button>
                        <button class="btn btn-success btn-sm" onclick="runAllTests()">
                            <span class="icon">🚀</span>
                            Ejecutar Todas las Pruebas
                        </button>
                    </div>
                </div>
                <div id="dynamicTestsContainer" class="button-grid">
                    <p style="color: #6c757d; text-align: center; padding: 20px;">
                        Cargando tests...
                    </p>
                </div>
            </div>

            <!-- Sección de Codegen -->
            <div class="section">
                <h3>🎬 Record & Playback</h3>
                <div class="button-grid">
                    <button class="btn btn-warning" onclick="startCodegen('queoaccess')">
                        <span class="icon">🎥</span>
                        Grabar QueoAccess
                    </button>
                    <button class="btn btn-warning" onclick="startCodegen('custom')">
                        <span class="icon">🎥</span>
                        Grabar URL Personalizada
                    </button>
                    <button class="btn btn-info" onclick="startCodegen('firefox')">
                        <span class="icon">🦊</span>
                        Grabar en Firefox
                    </button>
                </div>
            </div>

            <!-- Sección de Utilidades -->
            <div class="section">
                <h3>🛠️ Utilidades</h3>
                <div class="button-grid">
                    <button class="btn btn-info" onclick="showReport()">
                        <span class="icon">📊</span>
                        Ver Reporte HTML
                    </button>
                    <button class="btn btn-info" onclick="installBrowsers()">
                        <span class="icon=">🔧</span>
                        Instalar Navegadores
                    </button>
                    <button class="btn btn-info" onclick="clearOutput()">
                        <span class="icon">🗑️</span>
                        Limpiar Salida
                    </button>
                </div>
            </div>

            <!-- Sección de Editor de Tests -->
            <div class="section">
                <h3>✏️ Editor de Tests</h3>
                <div class="button-grid">
                    <button class="btn btn-warning" onclick="openTestEditor()">
                        <span class="icon">📝</span>
                        Editar Tests
                    </button>
                    <button class="btn btn-success" onclick="saveTestChanges()">
                        <span class="icon">💾</span>
                        Guardar Cambios
                    </button>
                    <button class="btn btn-info" onclick="reloadTestList()">
                        <span class="icon">🔄</span>
                        Recargar Tests
                    </button>
                </div>
                
                <!-- Editor de Tests -->
                <div id="testEditor" class="test-editor" style="display: none;">
                    <div class="editor-header">
                        <select id="testSelector" class="test-selector">
                            <option value="">Seleccionar test...</option>
                        </select>
                        <button class="btn btn-sm btn-primary" onclick="loadTest()">Cargar</button>
                    </div>
                    <textarea id="testCode" class="test-code" placeholder="El código del test aparecerá aquí..."></textarea>
                    <div class="editor-actions">
                        <button class="btn btn-success" onclick="saveTest()">💾 Guardar</button>
                        <button class="btn btn-secondary" onclick="closeTestEditor()">❌ Cerrar</button>
                    </div>
                </div>
            </div>

            <!-- Salida de comandos -->
            <div class="section">
                <h3>📝 Salida de Comandos</h3>
                <div id="output" class="output">Panel de control listo. Selecciona una acción para comenzar.</div>
                <div id="status" class="status"></div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;

        function updateStatus(message, type = 'running') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function clearOutput() {
            document.getElementById('output').textContent = 'Salida limpiada.';
            document.getElementById('status').textContent = '';
        }

        function appendOutput(text) {
            const output = document.getElementById('output');
            output.textContent += '\n' + text;
            output.scrollTop = output.scrollHeight;
        }

        function setRunning(running) {
            isRunning = running;
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => {
                btn.disabled = running;
            });
        }

        async function runCommand(command, description) {
            if (isRunning) return;
            
            setRunning(true);
            updateStatus(`Ejecutando: ${description}...`, 'running');
            appendOutput(`\n$ ${command}`);
            
            try {
                const response = await fetch('/api/run-command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command })
                });
                
                if (response.ok) {
                    const result = await response.text();
                    appendOutput(result);
                    updateStatus(`${description} completado exitosamente`, 'success');
                } else {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
            } catch (error) {
                appendOutput(`Error: ${error.message}`);
                updateStatus(`Error en ${description}`, 'error');
            } finally {
                setRunning(false);
            }
        }

        function runTest(testName) {
            const commands = {
                'test-1': 'npx playwright test tests/test-1.spec.ts --headed',
                'example': 'npx playwright test tests/example.spec.ts --headed',
                'demo-todo': 'npx playwright test tests-examples/demo-todo-app.spec.ts --headed'
            };
            
            const command = commands[testName];
            if (command) {
                runCommand(command, `Prueba ${testName}`);
            }
        }

        function runAllTests() {
            runCommand('npx playwright test --headed', 'Todas las pruebas');
        }

        function startCodegen(type) {
            const commands = {
                'queoaccess': 'npx playwright codegen https://alex.queo.dev/login',
                'custom': 'npx playwright codegen',
                'firefox': 'npx playwright codegen -b firefox https://alex.queo.dev/login'
            };
            
            const command = commands[type];
            if (command) {
                runCommand(command, `Codegen ${type}`);
            }
        }

        function showReport() {
            runCommand('npx playwright show-report', 'Mostrar reporte');
        }

        function installBrowsers() {
            runCommand('npx playwright install', 'Instalar navegadores');
        }

        // Ejecutar comandos reales a través del servidor
        async function runCommandReal(command, description) {
            if (isRunning) return;
            
            setRunning(true);
            updateStatus(`Ejecutando: ${description}...`, 'running');
            appendOutput(`\n$ ${command}`);
            
            try {
                const response = await fetch('/api/run-command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        appendOutput(`✅ ${result.stdout || 'Comando ejecutado exitosamente'}`);
                        if (result.stderr) {
                            appendOutput(`⚠️ ${result.stderr}`);
                        }
                        updateStatus(`${description} completado exitosamente`, 'success');
                    } else {
                        throw new Error(result.error || 'Error desconocido');
                    }
                } else {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
            } catch (error) {
                appendOutput(`❌ Error: ${error.message}`);
                updateStatus(`Error en ${description}`, 'error');
            } finally {
                setRunning(false);
            }
        }

        // Funciones reales que ejecutan comandos
        window.runTest = (testName) => {
            const commands = {
                'login_queo': 'npx playwright test tests/login_queo.spec.ts --headed',
                'example': 'npx playwright test tests/example.spec.ts --headed',
                'demo-todo': 'npx playwright test tests-examples/demo-todo-app.spec.ts --headed',
                'copropiedad': 'npx playwright test tests/test_deactivate_activate_property.spec.ts --headed'
            };
            
            const command = commands[testName];
            if (command) {
                runCommandReal(command, `Prueba ${testName}`);
            }
        };

        window.runAllTests = () => {
            runCommandReal('npx playwright test --headed', 'Todas las pruebas');
        };

        window.startCodegen = (type) => {
            const commands = {
                'queoaccess': 'npx playwright codegen https://alex.queo.dev/login',
                'custom': 'npx playwright codegen',
                'firefox': 'npx playwright codegen -b firefox https://alex.queo.dev/login'
            };
            
            const command = commands[type];
            if (command) {
                runCommandReal(command, `Codegen ${type}`);
            }
        };

        window.showReport = async () => {
            if (isRunning) return;
            
            setRunning(true);
            updateStatus('Abriendo reporte HTML...', 'running');
            appendOutput('\n$ Abriendo reporte HTML...');
            
            try {
                const response = await fetch('/api/open-report');
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        appendOutput(`✅ ${result.message}`);
                        updateStatus('Reporte abierto exitosamente', 'success');
                    } else {
                        throw new Error(result.error || 'Error desconocido');
                    }
                } else {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
            } catch (error) {
                appendOutput(`❌ Error: ${error.message}`);
                updateStatus('Error al abrir reporte', 'error');
            } finally {
                setRunning(false);
            }
        };

        window.installBrowsers = () => {
            runCommandReal('npx playwright install', 'Instalar navegadores');
        };

        window.clearOutput = clearOutput;

        // Función para cargar y mostrar la lista de tests dinámicamente
        async function loadDynamicTests() {
            const container = document.getElementById('dynamicTestsContainer');
            container.innerHTML = '<p style="color: #6c757d; text-align: center; padding: 20px;">Cargando tests...</p>';
            
            try {
                const response = await fetch('/api/list-tests');
                if (response.ok) {
                    const tests = await response.json();
                    
                    if (tests.length === 0) {
                        container.innerHTML = '<p style="color: #6c757d; text-align: center; padding: 20px;">No se encontraron tests en la carpeta tests/</p>';
                        return;
                    }
                    
                    container.innerHTML = '';
                    
                    tests.forEach(test => {
                        const button = document.createElement('button');
                        button.className = 'btn btn-primary';
                        button.innerHTML = `<span class="icon">▶️</span> ${test.name}`;
                        button.onclick = () => runDynamicTest(test.path);
                        container.appendChild(button);
                    });
                    
                    appendOutput(`✅ ${tests.length} test(s) cargado(s) desde la carpeta tests/`);
                } else {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
            } catch (error) {
                container.innerHTML = `<p style="color: #dc3545; text-align: center; padding: 20px;">Error cargando tests: ${error.message}</p>`;
                appendOutput(`❌ Error cargando lista de tests: ${error.message}`);
            }
        }

        // Función para ejecutar un test dinámico
        function runDynamicTest(testPath) {
            const command = `npx playwright test ${testPath} --headed`;
            runCommandReal(command, `Test: ${testPath}`);
        }

        // Función para recargar la lista de tests
        function reloadTestsList() {
            updateStatus('Recargando lista de tests...', 'running');
            appendOutput('🔄 Recargando lista de tests...');
            loadDynamicTests();
            updateStatus('Lista de tests recargada', 'success');
        }

        // Cargar tests al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            loadDynamicTests();
        });

        window.loadDynamicTests = loadDynamicTests;
        window.reloadTestsList = reloadTestsList;
        window.runDynamicTest = runDynamicTest;
    </script>
    
    <!-- Script del Editor de Tests -->
    <script src="test-editor.js"></script>
</body>
</html>
